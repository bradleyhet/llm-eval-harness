name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PROMPTFOO_DISABLE_TELEMETRY: "1"

jobs:
  quality:
    name: Lint, typecheck, unit tests, retrieval metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Retrieval regression gate
        run: npm run retrieval:metrics
      - name: Retriever comparison from the committed vector cache (no key)
        run: npm run retrieval:metrics -- --retriever embedding,hybrid
      - name: Retrieval evals through promptfoo (no LLM, no key)
        run: npx promptfoo eval -c promptfooconfig.retrieval.yaml --no-cache -o results/retrieval.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: retrieval-metrics
          path: |
            results/retrieval-metrics*.json
            results/retrieval.json

  smoke-eval:
    name: Smoke eval (promptfoo, tier=smoke)
    needs: quality
    # Secrets are not available to fork PRs, so only run on pushes and same-repo PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      # promptfoo keeps its response cache in ~/.promptfoo/cache. Only the judge's calls go through
      # it (the assistant is a file:// provider and always runs fresh), so a judge reply is reused
      # only when the assistant's answer is identical to one already graded.
      - name: Cache promptfoo responses
        uses: actions/cache@v5
        with:
          path: ~/.promptfoo/cache
          key: promptfoo-${{ hashFiles('promptfooconfig.yaml', 'evals/**', 'src/**', 'corpus/**') }}
          restore-keys: promptfoo-
      - name: Run smoke tier
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >
          npx promptfoo eval -c promptfooconfig.yaml
          --filter-metadata tier=smoke
          --max-concurrency 4
          -o results/smoke.json -o results/smoke.html
      # As in the weekly run, a failing case is re-run once and the job goes red only if it fails
      # again. The re-run skips the cache, which would otherwise hand back the same judge reply.
      - name: Fail on failures that repeat
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          gate="bun scripts/summarise-results.ts results/smoke.json --sha ${{ github.sha }} --tier smoke --results /dev/null --fail-on-unexpected"
          $gate && exit 0
          npx promptfoo eval -c promptfooconfig.yaml --no-cache --max-concurrency 4 \
            --filter-failing results/smoke.json \
            -o results/smoke-rerun.json || true
          $gate --rerun results/smoke-rerun.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: smoke-eval
          path: |
            results/smoke.json
            results/smoke.html
            results/smoke-rerun.json
