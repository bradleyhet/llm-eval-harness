name: Weekly full eval

on:
  schedule:
    - cron: "0 18 * * 0" # Sunday 18:00 UTC, Monday 02:00 AWST. Weekly since 2026-10-21 (judge cost)
  workflow_dispatch:

permissions:
  contents: write

env:
  PROMPTFOO_DISABLE_TELEMETRY: "1"

jobs:
  full-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - name: Retrieval metrics
        run: npm run retrieval:metrics
      - name: Retrieval evals (no LLM)
        run: npx promptfoo eval -c promptfooconfig.retrieval.yaml --no-cache -o results/retrieval.json
      - name: Full eval (no cache, so latency and cost are real)
        id: eval
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >
          npx promptfoo eval -c promptfooconfig.yaml
          --no-cache --max-concurrency 3
          -o results/full.json -o results/full.html
      - name: Append run to RESULTS.md
        run: bun scripts/summarise-results.ts results/full.json results/retrieval.json --sha ${{ github.sha }} --tier full
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: full-eval
          path: |
            results/full.json
            results/full.html
            results/retrieval-metrics.json
      - uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "results: weekly full eval ${{ github.sha }}"
          file_pattern: "RESULTS.md results/summary-*.json results/retrieval-metrics.json"
      # Known failures (metadata.known_failure: true) are expected to fail and are listed in the
      # README. Any other failure is re-run once, because across 143 judged cases a one-off judge
      # or model miss is routine, and the run goes red only on a case that fails both times. The
      # first run's failures are still the ones recorded in RESULTS.md and the committed summary.
      - name: Fail on unexpected failures
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          gate="bun scripts/summarise-results.ts results/full.json results/retrieval.json --sha ${{ github.sha }} --tier full --results /dev/null --fail-on-unexpected"
          $gate && exit 0
          npx promptfoo eval -c promptfooconfig.yaml --no-cache --max-concurrency 3 \
            --filter-failing results/full.json --filter-metadata known_failure=false \
            -o results/rerun.json || true
          $gate --rerun results/rerun.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: full-eval-rerun
          path: results/rerun.json
          if-no-files-found: ignore
