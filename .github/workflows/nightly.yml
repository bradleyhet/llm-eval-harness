name: Nightly full eval

on:
  schedule:
    - cron: "0 18 * * *" # 02:00 AWST
  workflow_dispatch:

permissions:
  contents: write

env:
  PROMPTFOO_DISABLE_TELEMETRY: "1"

jobs:
  full-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - name: Retrieval metrics
        run: npm run retrieval:metrics
      - name: Retrieval evals (no LLM)
        run: npx promptfoo eval -c promptfooconfig.retrieval.yaml --no-cache -o results/retrieval.json
      - name: Full eval (no cache, so latency and cost are real)
        id: eval
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: >
          npx promptfoo eval -c promptfooconfig.yaml
          --no-cache --max-concurrency 3
          -o results/full.json -o results/full.html
      - name: Append run to RESULTS.md
        run: bun scripts/summarise-results.ts results/full.json results/retrieval.json --sha ${{ github.sha }} --tier full
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-eval
          path: |
            results/full.json
            results/full.html
            results/retrieval-metrics.json
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "results: nightly full eval ${{ github.sha }}"
          file_pattern: "RESULTS.md results/summary-*.json results/retrieval-metrics.json"
      # Known failures (metadata.known_failure: true) are expected to fail and are listed in the
      # README; the nightly goes red only when a case that is not tagged fails.
      - name: Fail on unexpected failures
        run: bun scripts/summarise-results.ts results/full.json results/retrieval.json --sha ${{ github.sha }} --tier full --results /dev/null --fail-on-unexpected
