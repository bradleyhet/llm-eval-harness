# Retrieval labels for the Corella Bank corpus.
# Each query lists the chunk ids that genuinely answer it. Chunk ids are
# <file-slug>#<heading-slug>; see corpus/README.md for the slug rule and
# corpus/FACTS.md for the fact ledger. tests/retrieval-labels.test.ts fails
# if any id here stops resolving to a real heading.
#
# difficulty:
#   easy        wording overlaps the heading or the chunk directly
#   paraphrase  casual or indirect wording, few or no shared keywords
#   distractor  the corpus holds a lookalike chunk with a different fact;
#               only the correct side is listed as relevant

