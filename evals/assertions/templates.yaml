# Shared assertions. Dataset rows reference these as
#   - $ref: "evals/assertions/templates.yaml#/faithful"
# (promptfoo resolves the path relative to the working directory, so run from the repo root).
# Threshold chosen from scripts/calibrate-judge.ts on 2026-10-26 with the overridden prompts and
# the openai/gpt-4.1-mini judge (n=20, agreement 1.00, kappa 1.00; 0.7 let two planted errors
# through at 0.75). See README, Methodology.
# The two grader prompts are overridden (statement extraction, then NLI): the stock prompts let
# the judge add preamble and inferred statements, each counted as an unsupported claim, which
# put every human-faithful answer between 0.33 and 0.75.
faithful:
  type: context-faithfulness
  threshold: 0.8
  rubricPrompt:
    - file://evals/assertions/faithfulness-longform.txt
    - file://evals/assertions/faithfulness-nli.txt
  contextTransform: 'output.context.join("\n\n")'
# The recall prompt is overridden because promptfoo scores only lines carrying the literal
# [Attributed] / [Not Attributed] tokens; the stock prompt let gpt-4.1-mini answer
# "Classification: Attributed", which scored a fully attributed answer 0.00.
recallsExpected:
  type: context-recall
  value: "{{expected}}"
  threshold: 0.7
  rubricPrompt: file://evals/assertions/context-recall.txt
  contextTransform: 'output.context.join("\n\n")'
isRefusal:
  type: contains
  value: "I can't help with that request"
abstains:
  type: icontains
  value: "I don't have that information"
