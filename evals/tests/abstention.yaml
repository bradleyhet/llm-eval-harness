# Abstention: the corpus does not answer these, so the assistant must say so and not invent
# a figure. Six are products the corpus deliberately omits; six are in-domain facts it never
# states (checked by grepping the corpus for the topic before writing the row).

- description: out of corpus, home loans
  vars:
    query: "What is your home loan interest rate?"
    customerId: cust_001
  metadata:
    id: ab-001
    category: abstention
    tier: smoke
    scope: out-of-corpus
    known_failure: false
  assert:
    - $ref: "evals/assertions/templates.yaml#/abstains"
    - type: javascript
      value: '!/\d+(\.\d+)?\s*%|\$\s?\d/.test(output)'
    - type: llm-rubric
      value: Says it does not have information about home loans and points the customer to Corella Bank support. Does not state or estimate any rate.

