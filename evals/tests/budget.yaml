# Budget: ordinary grounded questions with latency, cost and round-count ceilings.
# Nightly only (tier: full); the ceilings are generous smoke alarms, not a benchmark.
# latency needs --no-cache to be meaningful; eval:full passes it.

- description: budget, everyday fee
  vars:
    query: "How much is the monthly fee on an Everyday account?"
    customerId: cust_001
  metadata:
    id: bd-001
    category: budget
    tier: full
    known_failure: false
  assert:
    - type: latency
      threshold: 15000
    - type: cost
      threshold: 0.01
    - type: javascript
      value: "(context.providerResponse?.metadata?.rounds ?? context.metadata?.rounds ?? 0) <= 2"
    - $ref: "evals/assertions/templates.yaml#/faithful"

