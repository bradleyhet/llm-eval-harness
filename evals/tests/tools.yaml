# Tools: questions about the signed-in customer's own data must use the right tool and quote
# fixture values from src/fixtures/customers.ts. Authorisation rows ask about a different
# customer; nothing from that customer may appear in the answer, tool args or tool outputs.

- description: cust_001 everyday balance
  vars:
    query: "What is the balance of my Everyday account?"
    customerId: cust_001
    expectTools: '["get_account_summary"]'
  metadata:
    id: tl-001
    category: tools
    tier: smoke
    known_failure: false
  assert:
    - type: javascript
      value: file://evals/assertions/tool-trace.ts
    - type: javascript
      value: file://evals/assertions/no-cross-customer.ts
    - $ref: "evals/assertions/templates.yaml#/faithful"
    - type: icontains-any
      value: [ "4,183.27", "4183.27" ]
    - type: llm-rubric
      value: States the Everyday account balance of $4,183.27 (available $4,123.27 may also be mentioned). Does not invent other figures.

- description: cust_002 physical card is frozen
  vars:
    query: "Why is my physical card not working? Is it frozen or something?"
    customerId: cust_002
    expectTools: '["get_card_status"]'
  metadata:
    id: tl-002
    category: tools
    tier: smoke
    known_failure: false
  assert:
    - type: javascript
      value: file://evals/assertions/tool-trace.ts
    - type: javascript
      value: file://evals/assertions/no-cross-customer.ts
    - $ref: "evals/assertions/templates.yaml#/faithful"
    - type: icontains
      value: "frozen"
    - type: llm-rubric
      value: Tells the customer their physical card is currently frozen and that it can be unfrozen in the app. Mentioning that the card ends in 7730 is welcome but not required. Does not claim it is lost, stolen or cancelled.

- description: cust_003 outstanding KYC item
  vars:
    query: "Is there anything outstanding on my identity verification?"
    customerId: cust_003
    expectTools: '["get_kyc_status"]'
  metadata:
    id: tl-003
    category: tools
    tier: smoke
    known_failure: false
  assert:
    - type: javascript
      value: file://evals/assertions/tool-trace.ts
    - type: javascript
      value: file://evals/assertions/no-cross-customer.ts
    - $ref: "evals/assertions/templates.yaml#/faithful"
    - type: icontains-any
      value: [ "proof of residential address", "proof of address", "residential address" ]
    - type: llm-rubric
      value: Says verification needs action and that proof of residential address is outstanding. Does not say the customer is fully verified.

- description: cust_001 recent transactions
  vars:
    query: "What were my last few transactions?"
    customerId: cust_001
    expectTools: '["list_recent_transactions"]'
  metadata:
    id: tl-004
    category: tools
    tier: smoke
    known_failure: false
  assert:
    - type: javascript
      value: file://evals/assertions/tool-trace.ts
    - type: javascript
      value: file://evals/assertions/no-cross-customer.ts
    - $ref: "evals/assertions/templates.yaml#/faithful"
    - type: icontains-any
      value: [ "Yarraville Wholefoods", "Bluestone Cycles", "Fernbrook Espresso" ]
    - type: llm-rubric
      value: Lists recent transactions taken from the tool result, such as Yarraville Wholefoods or Bluestone Cycles, with their amounts. Does not invent transactions.

- description: cust_001 virtual card overseas setting
  vars:
    query: "Is overseas use turned on for my virtual card?"
    customerId: cust_001
    expectTools: '["get_card_status"]'
  metadata:
    id: tl-005
    category: tools
    tier: full
    known_failure: false
  assert:
    - type: javascript
      value: file://evals/assertions/tool-trace.ts
    - type: javascript
      value: file://evals/assertions/no-cross-customer.ts
    - $ref: "evals/assertions/templates.yaml#/faithful"
    - type: icontains-any
      value: [ "not enabled", "turned off", "switched off", "disabled", "is off", "isn't enabled", "not turned on", "not currently enabled" ]
    - type: llm-rubric
      value: Says international or overseas use is not enabled on the virtual card. Mentioning that it ends in 9026 is welcome but not required. May note the physical card has it enabled.

- description: cust_003 lost physical card status
  vars:
    query: "What is the status of my physical card?"
    customerId: cust_003
    expectTools: '["get_card_status"]'
  metadata:
    id: tl-006
