# Grounded Q&A: the answer must come from retrieved corpus chunks and state the right fact.
# Every expected value is taken from corpus/FACTS.md. Rows on distractor pairs carry a
# not-icontains on the lookalike chunk's figure so a wrong-side answer fails.

- description: everyday account monthly fee
  vars:
    query: "How much is the monthly fee on an Everyday account?"
    customerId: cust_001
    expected: "The Everyday account fee is $5 a month, waived in any calendar month where $1,000 or more is deposited."
  metadata:
    id: gr-001
    category: grounded
    tier: smoke
    distractor_pair: everyday-vs-saver-fee
    known_failure: false
  assert:
    - $ref: "evals/assertions/templates.yaml#/faithful"
    - $ref: "evals/assertions/templates.yaml#/recallsExpected"
    - type: icontains-any
      value: [ "$5", "5 dollars", "five dollars" ]
    - type: not-icontains
      value: "$0 a month"
    - type: llm-rubric
      value: States that the Everyday account fee is $5 per month. Mentioning the $1,000 monthly deposit waiver is welcome but not required. Does not invent any other fee.

