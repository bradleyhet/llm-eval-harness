# Human-labelled answers for calibrating the context-faithfulness judge.
# Ten faithful answers and ten that each plant exactly one claim the context does not support.
# `contextChunkIds` are resolved to chunk text by scripts/calibrate-judge.ts, so the context the
# judge sees is exactly what the assistant would have retrieved.
- id: cal-01
  query: "How much is the monthly fee on an Everyday account?"
  contextChunkIds: [fees-and-limits#everyday-account-fees]
  answer: "The Everyday account costs $5 a month, charged on the first day of the month for the previous month. The fee is waived in any calendar month where you deposit $1,000 or more, and transfers from a Saver do not count towards that."
  faithful: true
  note: Restates the fee, timing and waiver as written.
